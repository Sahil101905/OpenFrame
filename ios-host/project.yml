name: OpenFrameHost

# Regenerate the .xcodeproj with:  cd ios-host && xcodegen generate
# See documentation/setup-macos.md for the full workflow.

options:
  bundleIdPrefix: com.openframe
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Simulator builds require no signing team; a device build needs one set in
    # Xcode (see documentation/setup-macos.md).
    CODE_SIGN_STYLE: Automatic

targets:
  OpenFrameHost:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openframe.host
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpenFrame
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"

  OpenFrameHostTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests
    dependencies:
      - target: OpenFrameHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openframe.host.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  OpenFrameHost:
    build:
      targets:
        OpenFrameHost: all
    run:
      config: Debug
    test:
      targets:
        - OpenFrameHostTests
